services:
  # 数据库
  db:
    image: mysql:8.0
    container_name: w_test_mysql_db  # 修改：项目名前缀改为 w_test_
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: whp1148..
      MYSQL_DATABASE: w_test_db  # 修改：数据库名改为 w_test_db
      TZ: Asia/Shanghai
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - /Users/whp/mysql:/var/lib/mysql  # 修改：本地目录改为 w_test_mysql
    networks:
      - w_test_network  # 添加：使用自定义网络

  # Redis 消息队列
  redis:
    image: redis:7
    container_name: w_test_redis  # 修改
    restart: always
    networks:
      - w_test_network  # 添加

  # FastAPI 后端
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.hybrid
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    container_name: w_test_backend  # 修改
    environment:
      - TZ=Asia/Shanghai
      - APP_NAME=w_test  # 添加：应用名环境变量
      - DB_NAME=w_test_db  # 添加：数据库名环境变量
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - ./backend:/app
      - ./uploads:/data/uploads
      - ./chroma_db:/data/chroma_db
      - ./reports:/data/reports
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - w_test_network  # 添加

  # Celery Worker (执行引擎)
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.hybrid
    command: celery -A app.tasks worker --loglevel=info
    container_name: w_test_worker  # 修改
    environment:
      - C_FORCE_ROOT=true
      - TZ=Asia/Shanghai
      - APP_NAME=w_test  # 添加
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY_ENABLED=False
    volumes:
      - ./backend:/app
      - ./uploads:/data/uploads
      - ./chroma_db:/data/chroma_db
      - ./reports:/data/reports
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - w_test_network  # 添加
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Nginx 前端
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: w_test_frontend  # 修改
    volumes:
      - ./reports:/usr/share/nginx/html/reports
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./uploads:/usr/share/nginx/html/uploads/
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - w_test_network  # 添加

# 定义网络
networks:
  w_test_network:  # 添加：自定义网络，便于服务间通信
    name: w_test_network
    driver: bridge